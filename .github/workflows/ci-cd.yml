name: Docker Compose CI

on:
  push:
    branches:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create SSL files from GitHub Secrets
        env:
          SSL_CERT_CONTENT: ${{ secrets.NGINX_CRT }}
          SSL_KEY_CONTENT: ${{ secrets.NGINX_KEY }}
        run: |
          echo "Creating SSL directory and files..."
          mkdir -p ./ssl
  
          echo "$SSL_CERT_CONTENT" > ./ssl/nginx.crt
          echo "$SSL_KEY_CONTENT" > ./ssl/nginx.key

          chmod 600 ./ssl/nginx.key

      - name: Create .env file from GitHub Secrets
        env:
          # Загружаем значения секретов во временные переменные
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PORT: ${{ secrets.POSTGRES_PORT }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_FORM_ID: ${{ secrets.E2E_FORM_ID }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

        run: |
          echo "Creating .env file for PostgreSQL..."

          cat << EOF > .env
          BACKEND_PORT=${BACKEND_PORT}
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASS}
          POSTGRES_PORT=${DB_PORT}
          PASSWORD_PEPPER=${PASSWORD_PEPPER}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          ADMIN_NAME=${ADMIN_NAME}
          SECRET_KEY=${SECRET_KEY}
          REDIS_PORT=${REDIS_PORT}
          REDIS_DB=${REDIS_DB}
          E2E_BASE_URL=${E2E_BASE_URL}
          E2E_FORM_ID=${E2E_FORM_ID}
          E2E_AUTH_EMAIL=${E2E_AUTH_EMAIL}
          E2E_AUTH_PASSWORD=${E2E_AUTH_PASSWORD}
          EOF

          cat << EOF > frontend/.env.e2e
          E2E_BASE_URL=${E2E_BASE_URL}
          E2E_FORM_ID=${E2E_FORM_ID}
          E2E_AUTH_EMAIL=${ADMIN_EMAIL}
          E2E_AUTH_PASSWORD=${ADMIN_PASSWORD}
          EOF

      - name: Start containers with Docker Compose
        run: docker compose -f "docker-compose.yml" up -d --build

      - name: Check frontend HTML for logo_etu.png
        run: |
          # Ждем доступность фронтенда (макс 30 сек)
          echo "Waiting for frontend starting..."

          timeout=30
          elapsed=0
          while ! curl -f -s -o /dev/null -k https://localhost; do
            sleep 2
            elapsed=$((elapsed + 2))
            if [ $elapsed -ge $timeout ]; then
              echo "Frontend did not started for $timeout seconds"
              exit 1
            fi
            echo "Try connection... ($elapsed сек.)"
          done

          echo "Frontend work correctly, check HTML..."

          html_content=$(curl -s -k https://localhost)

          if [ -z "$html_content" ]; then
            echo "Pages HTML is empty!"
            exit 1
          fi

          if [[ ! "$html_content" =~ \<html ]] || [[ ! "$html_content" =~ \<body ]]; then
            echo "HTML do not have basic tags (html/body)"
            exit 1
          fi

          if [[ "$html_content" =~ logo_etu\.png ]]; then
            echo "Found: logo_etu.png in HTML"

          else
            echo "TOTAL ERROR: HTML do not has logo_etu.png !"
            echo "--- Start HTML for debug ---"
            echo "$html_content" | head -20
            echo "--- End of HTML ---"
            exit 1
          fi

          title=$(echo "$html_content" | grep -o '<title>[^<]*</title>' | sed 's/<title>//;s/<\/title>//')
          if [ -n "$title" ]; then
            echo "Title of page: $title"
          fi

          echo ""
          echo "HTML Stats:"
          echo "All checkpoints have been completed! Frontend work correctly."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_FORM_ID: ${{ secrets.E2E_FORM_ID }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
        working-directory: frontend
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          
      - name: Stop containers
        if: always()
        run: docker compose -f "docker-compose.yml" down

      
