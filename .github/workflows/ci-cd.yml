name: Docker Compose CI

on:
  push:
    branches:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create SSL files from GitHub Secrets
        env:
          SSL_CERT_CONTENT: ${{ secrets.NGINX_CRT }}
          SSL_KEY_CONTENT: ${{ secrets.NGINX_KEY }}
        run: |
          echo "Creating SSL directory and files..."
          mkdir -p ./ssl
  
          echo "$SSL_CERT_CONTENT" > ./ssl/nginx.crt
          echo "$SSL_KEY_CONTENT" > ./ssl/nginx.key

          chmod 600 ./ssl/nginx.key

      - name: Create .env file from GitHub Secrets
        env:
          # Загружаем значения секретов во временные переменные
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PORT: ${{ secrets.POSTGRES_PORT }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_FORM_ID: ${{ secrets.E2E_FORM_ID }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

        run: |
          echo "Creating .env file for PostgreSQL..."

          cat << EOF > .env
          BACKEND_PORT=${BACKEND_PORT}
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASS}
          POSTGRES_PORT=${DB_PORT}
          PASSWORD_PEPPER=${PASSWORD_PEPPER}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          ADMIN_NAME=${ADMIN_NAME}
          SECRET_KEY=${SECRET_KEY}
          REDIS_PORT=${REDIS_PORT}
          REDIS_DB=${REDIS_DB}
          E2E_BASE_URL=${E2E_BASE_URL}
          E2E_FORM_ID=${E2E_FORM_ID}
          E2E_AUTH_EMAIL=${E2E_AUTH_EMAIL}
          E2E_AUTH_PASSWORD=${E2E_AUTH_PASSWORD}
          EOF

          cat << EOF > frontend/.env.e2e
          E2E_BASE_URL=${E2E_BASE_URL}
          E2E_FORM_ID=${E2E_FORM_ID}
          E2E_AUTH_EMAIL=${ADMIN_EMAIL}
          E2E_AUTH_PASSWORD=${ADMIN_PASSWORD}
          EOF

      - name: Start containers with Docker Compose
        run: docker compose -f "docker-compose.yml" up -d --build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Wait until API is ready
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          echo "Initial API probe:"
          curl -k -i "${E2E_BASE_URL}/api/v1/health" || true

          timeout=180
          elapsed=0
          until curl -k -f -sS "${E2E_BASE_URL}/api/v1/health" >/dev/null; do
            elapsed=$((elapsed + 3))
            if [ $elapsed -ge $timeout ]; then
              echo "API did not become ready in ${timeout}s"
              echo "Final API probe before fail:"
              curl -k -i "${E2E_BASE_URL}/api/v1/health" || true
              exit 1
            fi
            echo "API is not ready yet (${elapsed}s/${timeout}s)."
            curl -k -i "${E2E_BASE_URL}/api/v1/health" || true
            sleep 3
          done

          echo "API is ready:"
          curl -k -i "${E2E_BASE_URL}/api/v1/health"

      - name: Run Playwright tests
        timeout-minutes: 6
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_FORM_ID: ${{ secrets.E2E_FORM_ID }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
        working-directory: frontend
        run: npx playwright test --max-failures=1 --reporter=line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

      - name: Collect docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/compose
          docker compose -f docker-compose.yml ps > artifacts/compose/docker-compose-ps.txt || true

          for service in frontend backend postgres redis; do
            docker compose -f docker-compose.yml logs --no-color --tail=500 $service > "artifacts/compose/${service}.log" || true
          done

      - name: Upload docker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: artifacts/compose
          if-no-files-found: warn
          
      - name: Stop containers
        if: always()
        run: docker compose -f "docker-compose.yml" down
