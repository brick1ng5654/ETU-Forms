version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
    - "80:80"
    - "443:443"
    secrets:
      - ssl_certificate.crt
      - ssl_private.key
    depends_on:
      - backend
    networks:
      - app-network
    
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: db:latest
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres
      PORT: ${BACKEND_PORT}

      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: https://localhost,http://localhost:3000
      FILES_ROOT: /var/lib/postgresql/data/uploads
      MAX_UPLOAD_MB: 20
    volumes:
      - ./logs/backend:/app/logs/backend
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

secrets:
  ssl_certificate.crt:
    file: ./ssl/nginx.crt
  ssl_private.key:
    file: ./ssl/nginx.key

volumes:
  postgres_data:
  

networks:
  app-network:
    driver: bridge
